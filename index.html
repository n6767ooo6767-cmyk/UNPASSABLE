<style>
:root{--bg:#08090d;--card:#11131a;--line:#292d38;--text:#f5f7fa;--muted:#969dab;--ok:#39d98a;--accent:#a78bfa;--bad:#ff5d73}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b1533,#08090d 48%);color:var(--text);font-family:Inter,system-ui,sans-serif}
.lang{position:fixed;top:16px;left:16px;display:flex;gap:5px;background:#11131add;border:1px solid var(--line);padding:5px;border-radius:12px;z-index:5}.lang button{background:transparent;color:var(--muted);border:0;padding:7px 9px;border-radius:8px;cursor:pointer;font-weight:800}.lang button.active{background:#29243f;color:#fff}
main{max-width:820px;margin:auto;padding:70px 18px 40px}.logo{text-align:center;font-size:clamp(48px,10vw,90px);font-weight:1000;letter-spacing:-.08em}.tag{text-align:center;color:var(--muted);margin:2px 0 28px}
.panel{background:#11131aeF;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 24px 80px #0008}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.stage{font-weight:900}.count{color:var(--muted)}
.bar{height:7px;background:#252936;border-radius:99px;overflow:hidden;margin-bottom:18px}.fill{height:100%;width:0;background:var(--ok);transition:.25s}
input{width:100%;background:#090a0e;color:#fff;border:2px solid var(--line);border-radius:15px;padding:18px;font-size:22px;outline:0}input:focus{border-color:var(--accent)}
.current{margin-top:18px;border:1px solid #3b3455;background:#151323;border-radius:18px;padding:20px}.number{color:var(--accent);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.ruletext{font-size:23px;font-weight:800;line-height:1.3;margin-top:7px}.status{margin-top:12px;color:var(--muted)}
.history{display:grid;gap:7px;margin-top:14px}.old{padding:10px 12px;border:1px solid #1e513c;background:#0d1b16;border-radius:10px;color:#b9e9d0}.old b{color:var(--ok)}
.win{display:none;text-align:center;padding:30px 10px}.win h2{font-size:42px;margin:0 0 8px}.win p{color:var(--muted)}.win button{border:0;border-radius:12px;padding:12px 18px;background:#29243f;color:#fff;font-weight:900;cursor:pointer}
.hint{text-align:center;color:#666d7a;font-size:12px;margin-top:14px}
</style>
</head>

<div class="lang">

<div class="win" id="win"><h2 id="winTitle"></h2><p id="winText"></p><button onclick="location.reload()" id="again"></button></div>
<div class="hint" id="hint"></div>
</div>
</main>

const pw=document.getElementById("pw"), tag=document.getElementById("tag"), stage=document.getElementById("stage"), count=document.getElementById("count"), fill=document.getElementById("fill"), number=document.getElementById("number"), ruletext=document.getElementById("ruletext"), status=document.getElementById("status"), history=document.getElementById("history"), win=document.getElementById("win"), winTitle=document.getElementById("winTitle"), winText=document.getElementById("winText"), again=document.getElementById("again"), hint=document.getElementById("hint");
function updateLang(){const t=T[lang];document.documentElement.lang=lang;tag.textContent=t.tag;pw.placeholder=t.placeholder;hint.textContent=t.hint;winTitle.textContent=t.win;winText.textContent=t.winText;again.textContent=t.again;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active",b.dataset.l===lang));render()}
function render(){
 const t=T[lang], s=pw.value; let passed=0;
 while(passed<rules.length && rules[passed].fn(s)) passed++;
 const current=Math.min(passed,rules.length-1);
 stage.textContent=t.stage+" "+Math.min(passed+1,rules.length)+" / "+rules.length;
 count.textContent=t.progress(passed,rules.length);
 fill.style.width=(passed/rules.length*100)+"%";
 number.textContent=t.stage+" "+(current+1);
 ruletext.textContent=rules[current][lang];
 const currentPass=rules[current].fn(s);
 status.textContent=currentPass?t.passed:t.fail;
 status.style.color=currentPass?"var(--ok)":"var(--muted)";
 history.innerHTML="";
 for(let i=0;i<passed;i++){const d=document.createElement("div");d.className="old";d.innerHTML="<b>"+t.stage+" "+(i+1)+" ✓</b> — "+rules[i][lang];history.appendChild(d)}
 if(passed===rules.length){win.style.display="block";pw.disabled=true;number.textContent=t.win;ruletext.textContent=t.winText;status.textContent="";stage.textContent=t.win;count.textContent=t.progress(rules.length,rules.length)}
 else win.style.display="none";
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;updateLang()});
pw.addEventListener("input",render);updateLang();
</script>
</body>
</html>
